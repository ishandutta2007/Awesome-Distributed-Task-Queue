<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #a5b4fc; }
    
    /* Subtle CSS Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-card { animation: float 5s ease-in-out infinite; }
    .animated-flow { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Background Orbs -->
  <circle class="pulsing-orb" cx="150" cy="100" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)"/>
  <circle class="pulsing-orb" cx="1050" cy="300" r="220" fill="#9333ea" opacity="0.2" filter="url(#glow)"/>
  <circle class="pulsing-orb" cx="800" cy="80" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Network Background Flow (Dynamic aspect) -->
  <g opacity="0.3">
    <path class="animated-flow" d="M 100,320 C 300,280 400,380 600,310 C 800,240 900,350 1100,290" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path class="animated-flow" d="M 50,150 C 250,80 450,180 750,110 C 950,40 1050,160 1150,120" fill="none" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Node / Flow Graphic elements on Right side (background of text region kept clear) -->
  <g class="floating-card" opacity="0.85">
    <!-- Task Node 1 -->
    <rect x="850" y="140" width="220" height="60" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="880" cy="170" r="10" fill="#22c55e"/>
    <text x="905" y="175" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Worker Pool Active</text>
    
    <!-- Task Node 2 -->
    <rect x="890" y="230" width="220" height="60" rx="12" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="920" cy="260" r="10" fill="#eab308"/>
    <text x="945" y="265" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Durable Execution</text>
  </g>

  <!-- Foreground Title and Content Section (Clean & Highly Legible) -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="130" y="21" class="badge-text" text-anchor="middle">⚡ CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" class="title">
      Awesome Distributed Task Queue
    </text>

    <!-- Gradient Accent Underline -->
    <rect x="0" y="185" width="480" height="6" rx="3" fill="url(#primary-glow)"/>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle">
      Durable Workflows, Reliable Async Processing &amp; Job Orchestration
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="65" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">🐍 Python Celery</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="140" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="212" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">⏳ Temporal &amp; Go</text>

      <!-- Pill 3 -->
      <rect x="294" y="0" width="140" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="364" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">⚡ BullMQ &amp; Node</text>

      <!-- Pill 4 -->
      <rect x="446" y="0" width="150" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="521" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">🐘 Postgres Queues</text>
    </g>
  </g>
</svg>
